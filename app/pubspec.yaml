name: snap_here
description: "Photo-first local tourism community"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  go_router: ^17.5.0
  http: ^1.6.0
  sign_in_button: ^5.0.0
  camera: ^0.12.0+2
  photo_manager: ^3.12.0
  geolocator: ^14.0.3
  flutter_dotenv: ^6.0.1
  image: ^4.9.2
  google_maps_flutter: 2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/navigation/
    - assets/legal/privacy-policy.ko.md
    - assets/legal/privacy-consent.ko.md
    - assets/legal/terms-of-service.ko.md
