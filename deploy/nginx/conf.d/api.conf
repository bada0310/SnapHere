# SnapHere API 리버스 프록시 (HTTPS)
#
# 배치: ~/snaphere/nginx/conf.d/api.conf
#       (docker-compose.yml 이 ./nginx/conf.d 를 :ro 로 마운트한다)
# 반영: docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
#
# ⚠ .github/workflows/deploy.yml 은 app.jar 만 올린다. 이 파일은 배포에
#   포함되지 않으므로 서버로 직접 복사해야 한다(scp).
#
# ⚠ /etc/letsencrypt/live/snaphere.duckdns.org/ 에 인증서가 없으면
#   nginx 가 기동에 실패한다. certbot 발급을 먼저 끝낼 것.

resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP: ACME 챌린지 + HTTPS 리다이렉트 ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 챌린지. 리다이렉트보다 먼저 와야 한다.
    # 갱신(certbot renew)도 이 경로를 쓰므로 절대 지우지 말 것.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 전부 HTTPS 로. 308 은 메서드와 본문을 보존한다(301/302 는
    # POST 를 GET 으로 바꿔버리는 클라이언트가 있다 — 로그인 요청이 깨진다).
    location / {
        return 308 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name snaphere.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/snaphere.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snaphere.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    # 실제 파일 업로드는 S3 presigned URL 로 앱에서 직접 올라간다(SYS-020).
    # 여기를 지나는 건 JSON 뿐이라 크게 열어둘 이유가 없다.
    client_max_body_size 2m;

    # ── actuator ──────────────────────────────────────────────────────────
    # application.yml 이 health,info,metrics 를 노출한다. 저장소가 public 이고
    # 서버도 공인 IP 라, health 만 열고 나머지는 여기서 끊는다.
    location = /actuator/health {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # /actuator/metrics, /actuator/info, /actuator/env 등 전부 차단.
    # 404 로 준다 — 403 은 "여기 뭔가 있다"를 알려주는 셈이다.
    location /actuator {
        return 404;
    }

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # TourAPI 동기화 같은 관리 호출이 오래 걸릴 수 있다.
        proxy_read_timeout 60s;
    }

    # 공유 링크 OG 태그 (CMU-020). 카카오톡·슬랙 크롤러가 이 경로를 읽는다.
    location /p/ {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # 그 밖의 경로는 아무것도 알려주지 않는다.
    location / {
        return 404;
    }
}
